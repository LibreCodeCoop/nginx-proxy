networks:
  reverse-proxy:
    external: true
    name: reverse-proxy
  internal:
    driver: bridge

services:
  nginx-proxy:
    container_name: nginx-proxy
    image: nginxproxy/nginx-proxy:alpine
    restart: unless-stopped
    # Defaults keep 80/443 bound directly to the HTTP listeners.
    # For TLS SNI multiplexing, the host still exposes 80/443 but these
    # container ports become dedicated stream listeners.
    ports:
      - "80:${NGINX_PROXY_HTTP_CONTAINER_PORT:-80}"
      - "443:${NGINX_PROXY_HTTPS_CONTAINER_PORT:-443}"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./volumes/vhost.d/:/etc/nginx/vhost.d
      - ./volumes/conf.d:/etc/nginx/conf.d
      - ./volumes/certs:/etc/nginx/certs:ro
      - ./volumes/html:/usr/share/nginx/html
    networks:
      - reverse-proxy
    environment:
      - TZ

  nginx-proxy-acme:
    container_name: nginx-proxy-acme
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    networks:
      - reverse-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./volumes/vhost.d/:/etc/nginx/vhost.d
      - ./volumes/certs:/etc/nginx/certs:rw
      - ./volumes/html:/usr/share/nginx/html
      - ./volumes/acme/:/etc/acme.sh
    environment:
      - NGINX_PROXY_CONTAINER=nginx-proxy
      - TZ
