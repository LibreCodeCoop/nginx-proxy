name: Validate Docker Compose (direct and stream)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test direct and opt-in stream port mappings
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
